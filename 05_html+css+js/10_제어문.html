<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제어문</title>
</head>
<body>
    <script>
        /* 
            문(statements)
                1. 선언문
                2. 실행문


            제어문 -> 예약어
                1. 조건문: if, else, elseif
                2. 선택문: switch
                3. 반복문: while, do while, for
                4. 기타: break, continue
        */

        // if문 -------------------------------------
        /* 
            형식:
                if (조건식) {
                    코드;
                }
            의미:
                조건식 true이면 코드를 실행하고, false이면 실행하지 않는다.

            형식2:
                if(조건식) {
                    실행문1;
                }
                else {
                    실행문2;
                }
            의미: 
                조건식 true이면 실행문1을 실행하고, false이면 실행문2을 실행한다.
        */

        /* 
            객체는 속성과 메소드를 가지고 있다.
                속성은 객체의 특징
                메소드는 객체의 동작
            
            예) 현실세계
                승용차 객체
                    - 속성: 바퀴 4개, 블랙, 이름, 제조사
                    - 메소드: 정지한다. 움직인다. 
            예) 코드
                객체: window, document, location, ...
                    - 속성: href
                    - 메소드: write(), alert()

                형식:
                    객체.속성
                    location.href (알아 들음)
                    객체.메소드()
                    document.write()
                    window.alert()

                평서문
                    주어 목적어 서술어
                    나는 공부를 한다. (알아 들음)
                    한다 공부를 나는 (못 알아 들음)
                
                함수(function, 기능)
                    객체가 필요없는 메소드
        */
       // 선언문
       var pw = 123;
       var result = '잘못입력했습니다. 다시 한 번 입력해 주세요.';

       // 제어문
       if (pw === 1234) {
            // 실행문        
           location.href = 'https://naver.com';
       }
       // 실행문
       window.alert(result);
    </script>
</body>
</html>
