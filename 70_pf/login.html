<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 구현하기</title>
</head>
    <h1>메인 페이지</h1>
    <label for="pw">비밀번호:</label>
    <input type="text" id="pw" value="123">
    <button type="submit" id="login_btn">로그인</button>

    <script>
        /* 
            HTML 속성(attribute) -> attr()
            CSS 속성(property) -> css()

            객체(object): 
                window
                    |
                document, location, ...
                    |
                <html>
                    |
                <body>
                    |
                <input> 
                [objectHTMLInputElement] -> DOM
                객체
            
            메소드(method): getElementById()
            속성(property): value

            형식:
                객체.속성
                객체.메소드()

            var pw = document.getElementById('pw').value;

            함수 선언
                1. 변수 = 익명 함수 -> 이름없는 함수
                2. 선언적 함수 -> 이름없는 함수
            함수 호출(call)
                변수명()
                함수명()

            익명 함수 형식
                var 변수 = function(){};
            선언적 함수 형식
                function 함수명(){}
            함수 호출(call) 형식:
                변수명(); 또는 함수명();

            이벤트(event) -> 사건 발생, 인터렉티브(상호작용) 동작
                - 윈도우
                - 마우스: click, ...
                - 키보드
            
            이벤트 형식:
                이벤트가 발생하면 익명함수가 실행된ㄴ다.
                객체.on이벤트명 = 익명함수;
                login_btn.onclick = function(){ 실행문; };
        */
        // 선언문
        var pw = document.getElementById('pw').value;
        var login_btn = document.getElementById('login_btn');

        // 로그인 버튼을 클릭하면
        login_btn.onclick = function(){
        
        // 실행문;
        pw = document.getElementById('pw').value;

        // 제어문
        if (pw === 1234) {
            console.log('맞았어');
            // 실행문
            // location.href = 'https://naver.com';
        } else {
            console.log('틀렸어');
            // alert(result);
        }

            // 출력
            console.log(pw);
        };

     </script>
</body>
</html>
