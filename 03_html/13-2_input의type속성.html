<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
</head>
<body>
    아이디: <input type="text"> <br>
    비밀번호: <input type="password"> <br>
    <input type="hidden"> <br>

    검색: <input type="search"> <br>
    URL: <input type="url"> <br>
    전화번호: <input type="tel"> <br>
    이메일: <input type="email"> <br>

    수강 과목:
    <!-- checkbox와 radio의 value는 서버로 전송할 데이터 값이다. -->
    <input type="checkbox" name="chkgroup" value="html" checked>HTML
    <input type="checkbox" name="chkgroup" value="css">CSS <br>
    이메일 수신여부:
    <input type="radio" name="radiogroup" value="yes"> 동의 함
    <input type="radio" name="radiogroup" value="no"> 동의 하지 않음<br>
    
    수량: <input type="number"> <br>
    만족도: <input type="range"> <br>

    <!-- 전송: 가입하기, 로그인, ... -->
    <input type="submit" value="가입하기"> <br>
    <!-- 초기화: 취소, 로그아웃, ... -->
    <input type="reset" value="취소하기"> <br>
    <!-- 전송과 초기화가 아닌 경우: 애니메이션, ... -->
    <input type="button" value="가입하기"> <br>
    <!-- 버튼을 이미지로 디자인하여 사용하고 싶을 때(잘 안 씀, but svg파일로 올리면 이미지 깨짐현상 X) -->
    <input type="image" src="./../03_html/초기화버튼.png" alt="초기화버튼"> <br>
    <input type="image" src="./../03_html/로그인버튼.svg" alt="로그인"> <br>
    첨부할 파일: <input type="file"> <br>

    컬러 선택: <input type="color"> <br>

    <input type="date"> <br>
    <input type="datetime-local"> <br>
    <input type="month"> <br>
    <input type="week"> <br>
    <input type="time">
</body>
</html>
