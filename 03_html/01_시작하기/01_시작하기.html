<!-- 선언문 <!DOCTYPE html>은 이 문서가 HTML5 문서임을 정의 -->
<!DOCTYPE html>
<!-- en: 영문, ko: 한글, zh: 중국, ja: 일본 -->
<!-- https://www.w3schools.com/TAgs/ref_language_codes.asp -->
<html lang="en"><!-- HTML 페이지의 루트 요소 -->
<head><!-- 
    HTML 페이지에 대한 메타 정보가 포함되어 있습니다. 
    메타 정보? 데이터를 설명하는 데이터
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title><!-- HTML 페이지의 제목을 지정합니다(브라우저의 제목 표시줄이나 페이지 탭에 표시됨) -->
</head>
<body>
    <!-- 문서의 본문을 정의하고 제목, 문단, 이미지, 하이퍼링크, 표, 목록 등 모든 표시되는 콘텐츠를 담는 컨테이너입니다. -->
    <h1>My First Heading</h1><!-- 큰 제목을 정의 -->
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Expedita quas dignissimos, consectetur.</p>
    <p>rem quae possimus ullam molestiae facere ab dolor recusandae natus ducimus odio sapiente officia excepturi minus, iusto magni.</p><!-- 문단을 정의 -->
</body>
</html>
