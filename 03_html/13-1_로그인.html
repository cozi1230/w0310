<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
</head>
<body>
    <!-- 로그인 페이지의 경우 method는 post로 지정한다. -->
    <form action="#" method="post">
        <fieldset>
            <legend>로그인</legend> <!-- legend 태그는 필수 요소는 아니지만, 필요에 따라 사용하면 된다. (선택사항) -->
            <p>ID(아이디) : <input type="text"></p>
            <p>PW(비밀번호) : <input type="password"></p>
        </fieldset>
    </form>

</body>
</html>
