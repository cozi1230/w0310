<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML</title>
</head>
<body>
    <!-- 
    5대 브라우저
    1. CHROME134.x, OPERA, EDGE
    2. SAFARI
    3. FIREFOX 

    *can i use: https://caniuse.com -> 모든 것을 실행해줌
    -->



    <h1>폼</h1>
    <h2>input태그의 23개 타입</h2>

    
    입력상자<input type="text"> <br>
    비밀번호<input type="password"> <br>
    <!-- 브라우저에 안 보이는 것(데이타베이스), 웹 양식에 추가적인 데이터를 포함시킬 경우 사용 -->
    숨김필드<input type="hidden"> <br>

    <!-- 버튼 -->
    전송<input type="submit"> <br>
    취소<input type="reset"> <br>
    버튼<input type="button"> <br>
    이미지<input type="image"> <br>
    파일첨부<input type="file"> <br>

    <h2>경험 항목에 모두 선택</h2>
    <!-- 여러 개 中 여러 개를 선택 가능 -->
   <input type="checkbox" name="chkgroup">HTML
   <input type="checkbox" name="chkgroup">CSS
   <input type="checkbox" name="chkgroup">JavaScript <br>


    <!-- 
        alt+클릭 : 다중 커서 
        ctrl+alt+아래방향키    
    -->
     <!-- 
        name 속성으로 그룹핑한다. 
        name의 속성값은 임의 지정(단, 의미 있게) 
       -->
    <!-- 여러 개 中 하나만 선택 가능 -->
    <input type="radio" name="radiogroup">동의함
    <input type="radio" name="radiogroup">동의하지 않음 <br>

    검색<input type="search"> <br>
    전화번호<input type="tel"> <br>
    이메일<input type="email"> <br>
    웹주소<input type="url"> <br>

    <!-- 날짜/시간 -->
    1<input type="date"> <br>
    <!-- datetime-local을 사용하고, datetime은 사용하지 않는다. (잘 안 씀) -->
    2<input type="datetime"> <br><!-- 모든 브라우저 X -->
    3<input type="datetime-local"> <br> 
    4<input type="month"> <br><!-- firefox137. 윈도우 사파리5.x 지원 X -->
    5<input type="week"> <br><!-- firefox137. 윈도우 사파리5.x 지원 X -->
    6<input type="time"> <br><!-- firefox137. 윈도우 사파리5.x 지원 X -->

    <!-- 색 -->
    <input type="color"> <br>
    
    <!-- 범위 -->
     <!-- ex) 영화에 대한 인기도를 조사할 때, 조사한 전체 인원 中 몇 %의 인기도를 차지하는 가... -->
    <input type="range"> <br>

    <!-- 스핀 버튼 -->
    <input type="number"> <br> 

</body>
</html>
