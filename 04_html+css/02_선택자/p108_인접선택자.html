<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인접 형제 선택자</title>
    <style>
        /* 
            선택자1 + 선택자2
            형 + 인접한제
        */

        h1+p {
            color: blue;
        }
    </style>
</head>

<body>
    <h1>h1의 인접한 동생은 첫 번째 p이다.</h1>
    <p>첫 번째 p의 인접한 동생은 바로 아래 두 번째 p이다.</p>
    <p>p는 div의 세 번째 자식이다.</p>
</body>

</html>
