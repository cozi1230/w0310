<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML+CSS</title>
    <style>
        div,
        span {
            border: 1px solid #000;
        }

        .div1 {
            display: block;
            width: 200px;
        }

        .div2 {
            display: inline;
        }

        .div3 {
            display: inline-block;
            width: 200px;
        }

        .div4 {
            display: none;
        }

        
        .span1 {
            display: block;
        }

        .span2 {
            display: inline;
        }

        .span3 {
            display: inline-block;
        }

        .span4 {
            display: none;
        }
    </style>
</head>

<body>
    <div class="div1">div1 박스</div>
    <div class="div2">div2 박스</div>
    <div class="div3">div3 박스</div>
    <div class="div4">div4 박스</div>

    <span class="span1">span1 박스</span>
    <span class="span2">span2 박스</span>
    <span class="span3">span3 박스</span>
    <span class="span4">span4 박스</span>
</body>

</html>
