
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>box-sizing</title>
    <style>
        * {margin: 0; padding: 0;}
        /* body,p,ul {margin: 0;}
        ul {padding: 0;} */
        p {
            width: 600px;
            height: 100px;
            padding: 30px;
            border: 5px solid rgba(0,0,0,0.5);
            margin-bottom: 10px;
            background: rgba(255,255,0,0.5);
        }
        .sizing {
            box-sizing: border-box; /* bxb */
        }
        ul {
            display: flex;
            width: 500px;
            margin-top: 20px;
        }
        li {
            /* float:left; */
            width: 25%;
            /* 개별 속성 */
            /* list-style-type: none; */ /* lstn */
            /* 속기 속성 */
            list-style: none;
            background: rgba(0,0,100,0.3);
            text-align: center;
            padding:10px;
            /* box-sizing: border-box;는 width,height와 함께 사용한다. */
            box-sizing: border-box;
        }
        /* 
            even  2n    짝수
            odd   2n+1  홀수
        */
        li:nth-child(2n) {
            background: rgba(0,0,100,0.15);
        }
        a {
            text-decoration: none; /* tdn */
            color: #111;
        }
        a:hover {
            text-decoration: underline; /* tdu */
        }
    </style>
</head>
<body>
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit.</p>
    <p class="sizing">Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    <!-- ul.sizing_list>li*4>a[href="#"]{Company}   -->
    <ul>
        <li><a href="#">Company</a></li>
        <li><a href="#">Service</a></li>
        <li><a href="#">Custommer</a></li>
        <li><a href="#">Community</a></li>
    </ul>  
</body>
</html>
