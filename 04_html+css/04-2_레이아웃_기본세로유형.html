<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레이아웃-기본세로유형</title>
    <style>
        /* 
        선택자 {
            속성: 값;
            속성: 값;
            ...
        }
            선택자 종류
            1. 태그(요소, 타입) 선택자
        */
        div {
            width: 600px;
            height: 50px;
            background: #ccc;
        }

        .header {
            height: 50px;
        }

        .slide {
            height: 150px;
            background: #ffc0cb;
        }

        .contents {
            height: 100px;
            background: #dda0dd;
        }

        .footer {
            height: 50px;
        }
    </style>
</head>

<body>
    <div class="header">헤더</div>
    <div class="slide">슬라이드</div>
    <div class="contents">콘텐츠</div>
    <div class="footer">푸터</div>
</body>

</html>
