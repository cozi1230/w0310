<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML+CSS</title>
    <style>
    /* 
    모든 요소의 width와 height의 기본 값은 auto이다.

        display: 화면에 표시되는 방식
        1. block
            - 줄 바꿈 O
            - width는 부모 width 크기의 100%
            - height는 콘텐츠 크기
            - width와 height를 지정 O
            - margin은 상하좌우 모두 적용
        2. inline
            - 줄 바꿈 X
            - width와 height 모두 콘텐츠 크기 (기본값: 100% (auto))
            - width와 height를 지정 X
            - margin은 좌우만 적용
        3. inline-block
            - 인라인이면서 블록의 특징을 가진다.
            - 줄 바꿈 X
            - width와 height 모두 콘텐츠 크기
            - width와 height를 지정 O
            - margin은 상하좌우 모두 적용
        4. none :없음
    */

    body {margin: 0;} /* margin: 웹 사이트 내 여백을 의미 */
    div {
        width: 200px;
        height: 30px;
        border: 1px solid #000;
        padding: 10px; /* p10 */
        /* 위아래 여백의 경우 겹치면 큰 쪽으로 지정된다. */
        margin: 20px; /* m20 */
        background: lightblue;

    }
    span {
       /*  display: none; -> 투댑스 메뉴로 탁월(없어졌다 마우스 대면 나타나는 효과) */
        display: inline-block;
        /* width와 height가 지정되지 않는다. */
        /* width: 200px;
        height: 30px; */
        border: 1px solid #000;
        /* 요소가 겹칠 수 있다. */
        padding: 10px;
        /* 위 아래는 적용되지 않는다. */
        margin: 20px;
        background: pink;
    }
    </style>
</head>
<body>
<!-- 
    요소(Element)
     1. 블록 레벨 요소: div, ...
     2. 인라인 요소: span, ... 
-->
    <!-- div는 display:block; -->
    <div>div 박스</div>
    <div>div 박스</div>
    <!-- span는 display:inline; -->
    <span>span 박스</span>
    <span>span 박스</span>
</body>
</html>
