<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flexiable 방식</title>
    <style>
        /* 
            어떤 요소에 display:flex;를 지정하면
            그 요소는 플렉스 컨테이너가 되고,
            자식 요소는 플렉스 아이템이 된다.

            플렉스 컨테이너
                1. flex-direction + flex-wrap = flex-flow
                2. justify-content
                3. align-items
                4. align-content

            플렉스 아이템
                1. align-self               
                2. flex-grow + flex-shrink + flex-basis = flex
                3. order
        */

        .flexbox {
            /* 가로배치: width가 자식 크기, height는 부모 크기의 100% */
            display: flex;
            height: 200px;
            background: #ccc;
        }

        .flexbox > div {
            background: darkcyan;
            width: 200px;
            margin: 10px;
            flex: 0 1 auto;

            /* flex:1; 
            flex:1 1 0; 
            flex:1 1 auto; 
            flex:1 1 10px;

            flex-grow: 0;
            flex-shrink: 1;
            flex-basis: 200px; */

            /* glow와 shink가 1이면 basis는 어떤 값이든 같다. */

        }

    </style>
</head>
<body>
    <div class="flexbox">
        <!-- 블록레벨요소는 width는 부모 크기의 100% 이며, 줄바꿈되기 때문에 세로(위에서 아래로) 배치된다. height는 자식 크기만큼 지정된다. -->
        <div>flex-item</div>
        <div>flex-item</div>
        <div>flex-item</div>
    </div>
</body>
</html>
