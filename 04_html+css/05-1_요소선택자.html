<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML+CSS</title>
    <style>
        /* 
            선택자의 종류
            1. 기본(simple) 선택자
            2. 결합자 (combiantor) 선택자
            3. 의사클래스(슈도, 유사, Pseudo-class) 선택자
            4. 의사요소(슈도, 유사, Pseudo-elements) 선택자
            5. 속성(attribute) 선택자
        */

        /* 
            기본 선택자
                1. element(type, tag)- 태그 이름
                2. class - .이름
                3. id - #이름
                4. group(그룹) - ,(콤마)
                5. all(전체) - *(별표)
        */
        /*
        본문의 p태그를 선택하여 글자색을 빨강으로 지정한다.
        */
        p {
            /* 글자색을 빨강으로 */
            color: red;
        }
    </style>
</head>

<body>
    <h1>선택자</h1>
    <h2>요소(타입, 태그) 선택자</h2>
    <p>요소 선택자란 HTMl 태그명을 사용하는 선택자이다.</p>
    <p>요소 선택자란 HTMl 태그명을 사용하는 선택자이다.</p>
</body>
</html>
